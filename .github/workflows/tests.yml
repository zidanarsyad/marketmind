name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU-only PyTorch, then the requirements
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Fast tests
        run: python -m pytest -q -m "not slow"

      - name: Full test suite with coverage
        run: python -m pytest -q --cov --cov-report=term

  web:
    # the Vue front end in frontend/: component tests (Vitest), type-check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Component tests
        run: npm test

      - name: Type-check and build
        run: npm run build
