[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"

[server]
# Only this machine can open the dashboard. To share it on your network, run:
#   streamlit run app/dashboard.py --server.address 0.0.0.0
address = "localhost"
headless = true
runOnSave = false

[browser]
gatherUsageStats = false
