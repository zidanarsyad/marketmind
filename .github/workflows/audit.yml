name: audit

# Known vulnerabilities in the dependencies, checked on every push and pull request and once a week (new advisories
# appear without any change here). A separate workflow, so a new advisory shows up as "audit" failing, not as the tests.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"   # Mondays, 02:00 UTC

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      # What CI and a fresh `pip install -r requirements.txt` get: the newest versions the ranges allow. Blocking.
      - name: Audit the newest versions requirements.txt allows
        run: pip-audit -r requirements.txt --progress-spinner off

      # The exact versions the evaluation ran under. Some have known vulnerabilities with fixes in newer releases;
      # refreshing the lock file means re-running the test suite and the evaluation, so for now this only reports.
      - name: Audit the pinned versions in requirements-lock.txt (report only)
        continue-on-error: true
        run: pip-audit -r requirements-lock.txt --no-deps --disable-pip --progress-spinner off

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # reads package-lock.json, no install needed; fails on high or critical advisories (moderate ones are listed)
      - name: Audit the front end's dependencies
        run: npm audit --audit-level=high
