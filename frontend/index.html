<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="MarketMind: eleven AI agents plan, collect, clean, analyse and report a market research study." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MarketMind</title>
    <script>
      // apply the saved theme before the first paint, so a dark-mode page never flashes white
      try {
        var pref = localStorage.getItem('mm-theme') || 'system'
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('app-dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
